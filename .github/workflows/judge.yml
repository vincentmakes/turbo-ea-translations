# Judge one language-pack pull request and merge it when the policy allows.
#
# Called only by pack-check.yml (pull_request_target) and sweep.yml
# (workflow_run / schedule / workflow_dispatch). All of those run the workflow
# definitions and scripts of the DEFAULT BRANCH with the base repository's
# token, so this file is written on the assumption that every pull-request value
# is hostile:
#
# * Nothing from the PR head is checked out, imported or executed. The judging
#   scripts are fetched from this repository at GITHUB_SHA (the base branch),
#   and the pack's bytes are read through the API as a git blob of the exact
#   head SHA, then written to a file that is only ever parsed as JSON.
# * No PR-controlled value is interpolated into a `run:` script: the only
#   `${{ }}` expressions in this file are in `env:`, `with:` and `if:`, and the
#   values that reach the scripts are re-validated there (PR number = digits,
#   SHAs = 40 hex, language code = the code pattern, version = x.y.z).
# * No cache and no artifact is used.
# * `validate` has read-only permissions; its token is given to the API step
#   only, never to the step that runs turbo-ea's validator. Only `merge` can
#   write, it runs only after `validate` succeeded for this same head SHA, and
#   it re-checks the live PR head before merging that exact SHA.
# * A contribution's commits must form a straight line (no merge commit), so
#   the head has a single merge base and the reviewed diff is what the squash
#   applies; after merging, the merge commit is checked to differ from its
#   parent in packs/<code>/pack.json only.
# * The validator is always the one of the latest turbo-ea release (else
#   main); the pack's app_version only selects which English text it is
#   compared with, so a pack cannot pick an older, more lenient validator.
name: Judge

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      head_sha:
        type: string
        required: true

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.inspect.outputs.kind }}
      code: ${{ steps.inspect.outputs.code }}
      blob_sha: ${{ steps.inspect.outputs.blob_sha }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      coverage: ${{ steps.validate.outputs.coverage }}
      identical: ${{ steps.validate.outputs.identical }}
    steps:
      - name: Get the judging scripts from the base branch
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          git init -q "$RUNNER_TEMP/judge"
          git -C "$RUNNER_TEMP/judge" fetch -q --depth 1 "https://github.com/$REPO.git" "$BASE_SHA"
          git -C "$RUNNER_TEMP/judge" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD

      - name: Inspect the pull request (files, path, pack header)
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 "$RUNNER_TEMP/judge/scripts/judge.py" inspect --out "$RUNNER_TEMP/pack"

      - name: Validate with turbo-ea's language_pack.py (no token)
        id: validate
        if: steps.inspect.outputs.kind == 'contribution'
        env:
          APP_VERSION: ${{ steps.inspect.outputs.app_version }}
          NEW_LANGUAGE: ${{ steps.inspect.outputs.new_language }}
          # Optional, set by the owner under Settings > Variables: a full
          # turbo-ea commit SHA to validate against instead of the release tag.
          TURBO_EA_VALIDATOR_SHA: ${{ vars.TURBO_EA_VALIDATOR_SHA }}
        run: >-
          python3 "$RUNNER_TEMP/judge/scripts/judge.py" validate
          --pack "$RUNNER_TEMP/pack/pack.json" --work "$RUNNER_TEMP/work"

  decide:
    name: decide
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      needs.validate.outputs.kind == 'contribution' &&
      needs.validate.outputs.head_sha == inputs.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # the one comment asking maintainers / the owner for a review
      issues: write         # (PR comments go through the issues API)
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - name: Get the judging scripts from the base branch
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          git init -q "$RUNNER_TEMP/judge"
          git -C "$RUNNER_TEMP/judge" fetch -q --depth 1 "https://github.com/$REPO.git" "$BASE_SHA"
          git -C "$RUNNER_TEMP/judge" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD

      - name: Apply the maintainer policy (no merge here)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          CODE: ${{ needs.validate.outputs.code }}
          BLOB_SHA: ${{ needs.validate.outputs.blob_sha }}
          COVERAGE: ${{ needs.validate.outputs.coverage }}
          IDENTICAL: ${{ needs.validate.outputs.identical }}
          # Set by the owner (Settings > Variables) to stop all automatic merges.
          AUTOMERGE_HALTED: ${{ vars.AUTOMERGE_HALTED }}
        run: python3 "$RUNNER_TEMP/judge/scripts/judge.py" decide

  merge:
    name: merge
    needs: [validate, decide]
    # Only a "merge" decision enters the repository-wide lock, so PRs that are
    # merely waiting never queue in it.
    if: >-
      needs.validate.result == 'success' &&
      needs.decide.result == 'success' &&
      needs.decide.outputs.action == 'merge' &&
      needs.validate.outputs.head_sha == inputs.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One merge at a time in the whole repository, so each one re-reads the
    # default branch after the previous merge (the "pack changed since this PR
    # branched" check then sees it) and the same PR is never merged twice.
    # GitHub keeps only one job pending per group: a third queued merge cancels
    # the second, which the daily sweep (or the next event) then picks up.
    concurrency:
      group: merge-default-branch
      cancel-in-progress: false
    permissions:
      contents: write       # merge, write MAINTAINERS for a new language
      pull-requests: write  # merge
      actions: write        # start registry.yml (index.json)
      issues: write         # open the halt issue if a post-merge check fails
    steps:
      - name: Get the judging scripts from the base branch
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          git init -q "$RUNNER_TEMP/judge"
          git -C "$RUNNER_TEMP/judge" fetch -q --depth 1 "https://github.com/$REPO.git" "$BASE_SHA"
          git -C "$RUNNER_TEMP/judge" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD

      - name: Re-check everything and merge the validated SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          CODE: ${{ needs.validate.outputs.code }}
          BLOB_SHA: ${{ needs.validate.outputs.blob_sha }}
          COVERAGE: ${{ needs.validate.outputs.coverage }}
          IDENTICAL: ${{ needs.validate.outputs.identical }}
          # Set by the owner (Settings > Variables) to stop all automatic merges.
          AUTOMERGE_HALTED: ${{ vars.AUTOMERGE_HALTED }}
        run: python3 "$RUNNER_TEMP/judge/scripts/judge.py" merge
