# Unit tests for the scripts, and static checks on the workflows themselves.
#
# Plain `pull_request`: it runs the PR's own code, which is the point (it tests
# changes to scripts/ and .github/), but with a read-only token and no secrets,
# and for a fork with GitHub's approval gate for outside contributors.
name: Tests

on:
  pull_request:
    paths: ["scripts/**", "tests/**", ".github/**"]
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/**"]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code under test
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q src
          git -C src fetch -q --depth 1 "https://github.com/$REPO.git" "$SHA"
          git -C src -c advice.detachedHead=false checkout -q --detach FETCH_HEAD

      - name: Run the tests
        working-directory: src
        run: python3 -m unittest discover -s tests -v
