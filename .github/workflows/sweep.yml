# Re-judge open pull requests outside their own push events:
#
# * workflow_run of "Review relay": a review was submitted or dismissed — judge
#   the open PR(s) whose head is that run's head SHA (a maintainer approval is
#   what merges a change to an existing language);
# * schedule: once a day, every open PR (catches anything an event missed);
# * workflow_dispatch: one PR, started by the owner.
#
# Why this is safe: workflow_run, schedule and workflow_dispatch all run the
# definitions on the default branch, not anything from a PR. From the relay run
# only `workflow_run.head_sha` is used, as an env value that judge.py checks is
# 40 hex characters; the PR list is then read from the API. judge.yml applies
# the same rules as for a pull_request_target event.
name: Sweep

on:
  workflow_run:
    workflows: ["Review relay"]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to judge
        required: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      - name: Get the judging scripts from the default branch
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          git init -q "$RUNNER_TEMP/judge"
          git -C "$RUNNER_TEMP/judge" fetch -q --depth 1 "https://github.com/$REPO.git" "$BASE_SHA"
          git -C "$RUNNER_TEMP/judge" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD

      - name: Find the pull requests to judge
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 "$RUNNER_TEMP/judge/scripts/judge.py" resolve

  judge:
    needs: resolve
    if: needs.resolve.outputs.prs != '' && needs.resolve.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    uses: ./.github/workflows/judge.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      pr_number: ${{ matrix.pr.number }}
      head_sha: ${{ matrix.pr.head_sha }}
